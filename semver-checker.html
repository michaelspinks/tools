<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemVer Validator Canvas</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --accent: #2dd4bf;
            --text: #e6edf3;
            --text-muted: #7d8590;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .canvas {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { margin-top: 0; font-size: 1.5rem; }

        input {
            width: 100%;
            padding: 12px;
            margin: 1rem 0;
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            border-radius: 6px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #result {
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            display: none;
        }

        .valid { background: rgba(63,185,80,0.15); color: #3fb950; border: 1px solid rgba(63,185,80,0.3); display: block !important; }
        .invalid { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.3); display: block !important; }

        .hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; }
    </style>
</head>
<body>

<div class="canvas">
    <h1>SemVer Validator</h1>
    <p>Paste a version string below to validate</p>
    
    <input type="text" id="semverInput" placeholder="e.g. 1.0.0-alpha+001" autocomplete="off">
    
    <div id="result"></div>

    <div class="hint">
        Format: MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]
    </div>
</div>

<script>
    const input = document.getElementById('semverInput');
    const result = document.getElementById('result');

    /**
     * Official SemVer 2.0.0 RegEx
     * Checks for:
     * 1. X.Y.Z (Major.Minor.Patch)
     * 2. No leading zeros on numbers (except '0' itself)
     * 3. Optional Pre-release (hyphen)
     * 4. Optional Build metadata (plus)
     */
    const SEMVER_REGEX = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;

    input.addEventListener('input', (e) => {
        const val = e.target.value.trim();

        if (val === "") {
            result.className = "";
            result.style.display = "none";
            return;
        }

        if (SEMVER_REGEX.test(val)) {
            result.textContent = "✓ Valid Semantic Version";
            result.className = "valid";
        } else {
            result.textContent = "✕ Invalid SemVer Format";
            result.className = "invalid";
        }
    });
</script>


    <div style="position:fixed;bottom:18px;left:18px;z-index:999;">
        <a href="/tools/" style="
            font-family:'IBM Plex Mono',monospace;
            font-size:0.75em;
            color:#7d8590;
            text-decoration:none;
            background:#161b22;
            border:1px solid #30363d;
            border-radius:6px;
            padding:6px 12px;
            transition:color 0.15s,border-color 0.15s;
        " onmouseover="this.style.color='#2dd4bf';this.style.borderColor='#2dd4bf'"
           onmouseout="this.style.color='#7d8590';this.style.borderColor='#30363d'">
            ← all tools
        </a>
    </div>

</body>
</html>
